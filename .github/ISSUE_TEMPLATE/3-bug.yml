name: Bug
description: Something behaves in a way it should not.
type: Bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should have happened
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Repo, plugin, environment, or vault path.
    validations:
      required: false
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Logs, screenshots, error text.
    validations:
      required: false
