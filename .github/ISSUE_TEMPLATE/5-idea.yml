name: Idea
description: Scratch pad. An unvalidated thought, not committed work. Nobody executes an Idea.
type: Idea
title: "[IDEA] "
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: Write it however it arrived. No structure required.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it might matter
      description: Optional. Leave blank if you do not know yet.
    validations:
      required: false
