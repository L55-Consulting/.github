name: Epic
description: 'A large outcome that changes how L55 or a client works, delivered through several Features, Stories, or Tasks. Test: no single piece delivers it on its own.'
type: Epic
body:
  - type: markdown
    attributes:
      value: |
        **Is this an Epic?** Yes if it changes how L55 or a client operates and no single capability or artefact delivers it. If one thing delivers it, use **Feature**.
        Children: Features, Stories, Spikes, Tasks. An Epic never sits under another Epic.
        After creating this issue, set the sidebar fields: **Program**, **Client**, **Agent Owner**, **Autonomy**, **Evidence Required** (usually Human Acceptance), **Accepted By**, **Target date**. A form cannot set them for you.
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: One sentence. What is true in the world when this is done that is not true now.
      placeholder: L55 sells a packaged AI audit offer to its first paying client.
    validations:
      required: true
  - type: textarea
    id: why-now
    attributes:
      label: Why now
      description: The reason to commit to this now. One or two sentences.
    validations:
      required: false
  - type: textarea
    id: scope-in
    attributes:
      label: Scope - in
      description: The pieces you expect, one per line. Each becomes a Feature, Story, or Spike.
    validations:
      required: true
  - type: textarea
    id: scope-out
    attributes:
      label: Scope - out
      description: Explicitly excluded. One item per line.
    validations:
      required: false
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: The observable signs the outcome happened. Each item must be true or false, not a matter of effort.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: For each criterion, how it is proven (a measure, a document, a signed agreement, a demo) and who checks it.
      value: |
        - Criterion 1:
        - Criterion 2:
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of Done
      description: Standard closing gates. Add items only if this Epic needs more.
      value: |
        - [ ] Every acceptance criterion verified, evidence linked in a comment
        - [ ] Open children closed or moved out of this Epic
        - [ ] Docs updated: <artefact>, or not needed
        - [ ] Accepted by the Accepted By person
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Budget, deadline, tool, policy, style.
    validations:
      required: false
  - type: textarea
    id: out-of-bounds
    attributes:
      label: Out of bounds
      description: Actions no executor may take under this Epic. Children inherit these. Examples - do not email the client, do not spend money, do not force-push, do not commit to a date on my behalf.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links to vault notes, GBrain records, prior issues, client material, decisions this depends on.
    validations:
      required: false
