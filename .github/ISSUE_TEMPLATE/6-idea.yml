name: Idea
description: A thought nobody has committed to. Never worked on. Ends by retype to a committed type, or by close as not planned.
type: Idea
title: "[IDEA] "
body:
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: Write it however it arrived. No structure required.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it might matter
      description: Optional. Leave blank if you do not know yet.
    validations:
      required: false
